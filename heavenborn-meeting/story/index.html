<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HeavenBorn｜逐字稿轉講課圖片</title><style>:root{--bg:#f5efe5;--ink:#1e1915;--muted:#74695d;--gold:#a87833;--line:#e3d7c7}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#151515;color:#eee;padding:22px 16px;display:flex;flex-direction:column}.logo{font-family:Georgia,"Noto Serif TC",serif;font-size:27px;color:#ead3a5}.sub{font-size:11px;color:#9d927f;letter-spacing:.14em}.nav{margin-top:26px}.nav div{padding:12px;border-radius:8px;margin:5px 0}.nav .on{background:linear-gradient(90deg,#8c642a55,transparent);border-left:3px solid #c49a57}.quote{margin-top:auto;color:#d8c39c;font-family:Georgia,"Noto Serif TC",serif;line-height:1.8}.main{min-width:0}.top{height:68px;background:#fffaf5cc;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}.top b{font-family:Georgia,"Noto Serif TC",serif}.wrap{padding:22px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{margin:0;font-family:Georgia,"Noto Serif TC",serif;font-size:28px}.hero p{margin:7px 0 0;color:var(--muted)}.btns{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d9ccb9;background:#fff;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.btn.gold{background:linear-gradient(135deg,#ba8d47,#8e6429);color:#fff;border:none}.grid{display:grid;grid-template-columns:42% 58%;margin-top:18px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.left{border-right:1px solid var(--line);background:#fcfaf6}.paste{padding:16px;border-bottom:1px solid var(--line)}textarea{width:100%;height:170px;border:1px solid #d8cbbb;border-radius:10px;padding:12px;resize:vertical;background:#fffdf9;line-height:1.65}.mini{font-size:12px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}.list{height:560px;overflow:auto;padding:10px}.card{display:grid;grid-template-columns:42px 1fr 96px;gap:10px;padding:10px;border-radius:10px;margin-bottom:6px;cursor:pointer}.card:hover{background:#fff}.card.on{background:#fff5df;border:1px solid #e2c382}.n{font-family:Georgia;font-size:18px}.card h3{font-size:14px;margin:0 0 5px}.card p{font-size:11px;line-height:1.45;color:#71685d;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.thumb{border-radius:7px;min-height:70px;background:linear-gradient(135deg,#6c4b2d,#d5a864);position:relative;overflow:hidden}.thumb:after{content:"";position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(transparent,#0008)}.right{padding:18px;background:#fffdf9}.previewHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.stage{aspect-ratio:16/9;border-radius:12px;overflow:hidden;position:relative;background:#222;box-shadow:0 18px 45px #4e32192a}.scene{position:absolute;inset:0}.scene:before,.scene:after{content:"";position:absolute;border-radius:999px;filter:blur(1px);opacity:.65}.scene:before{width:45%;height:45%;right:6%;top:8%;background:#f5d58f55}.scene:after{width:70%;height:30%;left:10%;bottom:-12%;background:#00000066}.scene.prophecy{background:linear-gradient(150deg,#3b2d23,#b88a43 55%,#ead7ad)}.scene.jesus{background:linear-gradient(145deg,#806443,#d5b98a 48%,#7791a1)}.scene.temple{background:linear-gradient(145deg,#9a7547,#e6d0a0 48%,#52453d)}.scene.storm{background:linear-gradient(145deg,#111827,#2e5770 50%,#8aa1aa)}.scene.palace{background:linear-gradient(145deg,#4f311d,#a47131 52%,#e3bd79)}.scene.battle{background:linear-gradient(145deg,#3a332d,#766452 52%,#b7905d)}.scene.cosmos{background:radial-gradient(circle at 72% 24%,#f2c75f 0 8%,transparent 9%),radial-gradient(circle at 58% 35%,#9fb7d8 0 4%,transparent 5%),linear-gradient(145deg,#070914,#18234f 58%,#342043)}.scene.seed{background:linear-gradient(180deg,#8eb36a 0 45%,#6c4b2d 46%)}.scene.scroll{background:linear-gradient(145deg,#4d3825,#b98b54 50%,#e9d3a6)}.scene.crowd{background:linear-gradient(145deg,#a97943,#e0c190 48%,#68776b)}.overlay{position:absolute;inset:0;background:linear-gradient(90deg,#0008 0 35%,transparent 68%)}.text{position:absolute;left:7%;right:7%;bottom:9%;color:#fff}.tag{font-size:14px;letter-spacing:.16em;color:#f2d8a3}.title{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(30px,4vw,64px);line-height:1.13;font-weight:700;text-shadow:0 4px 18px #0008;max-width:84%}.body{margin-top:12px;font-size:clamp(14px,1.4vw,23px);line-height:1.6;max-width:70%;color:#f6ead6}.verse .overlay{background:linear-gradient(90deg,#0005 0 42%,transparent)}.verse .text{left:auto;right:6%;bottom:14%;width:46%;background:#fff8e8e8;color:#30251b;border-radius:20px;padding:30px}.verse .title{color:#332719;text-shadow:none;font-size:clamp(28px,3.4vw,52px);max-width:100%}.verse .body{color:#5b4a39;max-width:100%}.evidence .text{left:6%;right:6%;bottom:8%;background:#14110dbd;padding:24px;border-radius:18px}.evidence .title{font-size:clamp(26px,3vw,48px)}.editor{display:grid;grid-template-columns:1fr 170px;gap:12px;margin-top:14px}.panel{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.panel label{font-size:11px;color:var(--muted);display:block;margin:8px 0 5px}.panel input,.panel select{width:100%;padding:9px;border:1px solid #d8cbbb;border-radius:7px;background:#fffdf9}.arrow{border:1px solid #d9ccbc;background:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer}.modal{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:20;padding:24px}.modal.show{display:flex}.modalBox{width:min(1200px,96vw)}.modalBar{display:flex;justify-content:space-between;color:#ddd;margin-bottom:9px}.modalStage{aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:10px}.x{background:#2a2a2a;color:#fff;border:none;padding:8px 11px;border-radius:7px}@media(max-width:980px){.app{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:1fr}.left{border-right:none;border-bottom:1px solid var(--line)}.list{height:420px}}@media(max-width:620px){.wrap{padding:14px}.hero{align-items:flex-start;flex-direction:column}.grid{margin-top:12px}.editor{grid-template-columns:1fr}.card{grid-template-columns:36px 1fr 78px}.top{padding:0 14px}.title{max-width:92%}.body{max-width:90%}}</style></head><body><div class="app"><aside class="side"><div class="logo">HeavenBorn</div><div class="sub">逐字稿轉講課圖片</div><div class="nav"><div class="on">▣ 主日信息</div><div>▤ 比喻故事</div><div>◫ 預言查驗</div></div><div class="quote">用影像，<br>讓真理被看見。</div></aside><main class="main"><div class="top"><b>讓神的話語，化為看得見的畫面</b><span>講者模式</span></div><div class="wrap"><div class="hero"><div><h1>逐字稿 → 幾十張講課圖片</h1><p id="meta">貼上完整講稿，自動拆成經文、故事、比喻與例子畫面。</p></div><div class="btns"><button class="btn" id="split">自動分段</button><button class="btn gold" id="present">講者模式</button><button class="btn" id="download">下載目前 PNG</button></div></div><div class="grid"><section class="left"><div class="paste"><textarea id="tx" placeholder="把完整逐字稿貼在這裡……"></textarea><div class="mini"><span>建議：經文、例子、轉折各自換行，畫面會更漂亮。</span><span id="count">0 字</span></div></div><div class="list" id="list"></div></section><section class="right"><div class="previewHead"><b>圖片預覽</b><div><button class="arrow" id="prev">‹</button> <span id="counter">0 / 0</span> <button class="arrow" id="next">›</button></div></div><div class="stage" id="stage"></div><div class="editor"><div class="panel"><label>圖片標題</label><input id="title"><label>場景</label><select id="scene"><option value="prophecy">預言／經卷</option><option value="jesus">耶穌教導</option><option value="temple">聖殿／耶路撒冷</option><option value="storm">風浪／危機</option><option value="palace">宮廷／王國</option><option value="battle">戰場／爭戰</option><option value="cosmos">日月星辰／宇宙</option><option value="seed">種子／田地</option><option value="scroll">書卷／封印</option><option value="crowd">群眾／講道</option></select></div><div class="panel"><label>版型</label><select id="layout"><option value="cinematic">電影故事圖</option><option value="verse">經文主視覺</option><option value="evidence">預言成就對照</option></select><button class="btn gold" style="width:100%;margin-top:12px" id="regen">重新判斷畫面</button></div></div></section></div></div></main></div><div class="modal" id="modal"><div class="modalBox"><div class="modalBar"><span id="mTitle">講者模式</span><button class="x" id="close">關閉</button></div><div class="modalStage" id="mstage"></div></div></div><script>const $=s=>document.querySelector(s);let slides=[],cur=0;const sample=`今天我們要談一個問題：聖經為什麼說自己是預言？\n\n《以賽亞書》46:10 說：我從起初指明末後的事，從古時言明未成的事。\n\n如果一本經書只是教人做好事，它不需要先說出未來。\n\n但聖經裡有大量「先寫下來，後來成就」的結構。\n\n例如舊約預言彌賽亞要來，新約則記錄耶穌的出生、受苦、死亡與復活。\n\n所以真正要查驗的不是你喜不喜歡，而是：前面的預言，後來有沒有成為事實？`;const sceneFor=t=>/日|月|星|天象|末日/.test(t)?'cosmos':/種子|田地|撒種/.test(t)?'seed':/風浪|海|船|暴風/.test(t)?'storm':/王|宮|國度|寶座/.test(t)?'palace':/戰|兵|爭戰|軍/.test(t)?'battle':/聖殿|耶路撒冷/.test(t)?'temple':/封|書卷|七印/.test(t)?'scroll':/耶穌|門徒|講道/.test(t)?'jesus':/群眾|眾人|五千/.test(t)?'crowd':'prophecy';const layoutFor=t=>/[《》]|福音|以賽亞|啟示錄|詩篇|箴言|希伯來書|:\d/.test(t)?'verse':/成就|應驗|對照|證據|預言/.test(t)?'evidence':'cinematic';function titleFor(t){let s=t.replace(/\s+/g,' ').trim().replace(/[《》]/g,'');if(s.length<24)return s;let p=s.split(/[。！？：；]/)[0];return(p.length>26?p.slice(0,26)+'…':p)||s.slice(0,26)+'…'}function splitText(){let raw=$('#tx').value.trim();if(!raw)return;let parts=raw.split(/\n\s*\n|(?<=[。！？])\s*(?=(?:《|[A-Za-z\u4e00-\u9fff]))/).map(x=>x.trim()).filter(Boolean);let out=[];for(let p of parts){if(p.length>220){for(let i=0;i<p.length;i+=180)out.push(p.slice(i,i+180))}else out.push(p)}slides=out.map((t,i)=>({id:i+1,text:t,title:titleFor(t),scene:sceneFor(t),layout:layoutFor(t)}));cur=0;render();save()}function render(){if(!slides.length){$('#stage').innerHTML='<div class="scene prophecy"></div><div class="overlay"></div><div class="text"><div class="tag">HEAVENBORN</div><div class="title">貼上逐字稿，開始生成講課畫面</div><div class="body">一段內容，一張生動的 16:9 故事圖。</div></div>';$('#list').innerHTML='';$('#counter').textContent='0 / 0';return}$('#list').innerHTML=slides.map((s,i)=>`<div class="card ${i===cur?'on':''}" data-i="${i}"><div class="n">${String(i+1).padStart(2,'0')}</div><div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div><div class="thumb" style="background:${thumbBg(s.scene)}"></div></div>`).join('');document.querySelectorAll('.card').forEach(x=>x.onclick=()=>{cur=+x.dataset.i;render()});paint($('#stage'),slides[cur]);paint($('#mstage'),slides[cur]);$('#counter').textContent=`${cur+1} / ${slides.length}`;$('#title').value=slides[cur].title;$('#scene').value=slides[cur].scene;$('#layout').value=slides[cur].layout;$('#meta').textContent=`已輸入 ${$('#tx').value.length.toLocaleString()} 字 · 自動分成 ${slides.length} 張`;$('#mTitle').textContent=`${cur+1}. ${slides[cur].title}`}function paint(el,s){el.className=(el.id==='mstage'?'modalStage ':'stage ')+(s.layout==='verse'?'verse':s.layout==='evidence'?'evidence':'');el.innerHTML=`<div class="scene ${s.scene}"></div><div class="overlay"></div><div class="text"><div class="tag">${tag(s.scene)}</div><div class="title">${esc(s.title)}</div><div class="body">${esc(short(s.text))}</div></div>`}function short(t){return t.replace(/\s+/g,' ').slice(0,125)+(t.length>125?'…':'')}function tag(s){return({prophecy:'預言 · 經卷',jesus:'耶穌 · 教導',temple:'聖殿 · 歷史',storm:'風浪 · 信心',palace:'宮廷 · 王國',battle:'爭戰 · 得勝',cosmos:'日月星辰 · 末世',seed:'種子 · 比喻',scroll:'書卷 · 封印',crowd:'群眾 · 講道'})[s]}function thumbBg(s){return({prophecy:'linear-gradient(135deg,#4b3829,#d1a45e)',jesus:'linear-gradient(135deg,#796146,#d6bd8c)',temple:'linear-gradient(135deg,#9b7545,#5c4b3d)',storm:'linear-gradient(135deg,#101827,#64879b)',palace:'linear-gradient(135deg,#57351f,#d0a052)',battle:'linear-gradient(135deg,#38332e,#9a7a58)',cosmos:'linear-gradient(135deg,#070914,#4e2c66)',seed:'linear-gradient(180deg,#8db369,#6f4c2e)',scroll:'linear-gradient(135deg,#5a4129,#d2aa6c)',crowd:'linear-gradient(135deg,#a87843,#69796b)'})[s]}function esc(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('hb-story',JSON.stringify({text:$('#tx').value,slides,cur}))}function load(){let o;try{o=JSON.parse(localStorage.getItem('hb-story'))}catch{}$('#tx').value=o?.text||sample;slides=o?.slides||[];cur=o?.cur||0;if(!slides.length)splitText();else render();count()}function count(){$('#count').textContent=$('#tx').value.length.toLocaleString()+' 字'}$('#tx').oninput=()=>{count();save()};$('#split').onclick=splitText;$('#prev').onclick=()=>{if(cur>0){cur--;render();save()}};$('#next').onclick=()=>{if(cur<slides.length-1){cur++;render();save()}};$('#title').oninput=e=>{slides[cur].title=e.target.value;render();save()};$('#scene').onchange=e=>{slides[cur].scene=e.target.value;render();save()};$('#layout').onchange=e=>{slides[cur].layout=e.target.value;render();save()};$('#regen').onclick=()=>{let s=slides[cur];s.scene=sceneFor(s.text);s.layout=layoutFor(s.text);render();save()};$('#present').onclick=()=>{$('#modal').classList.add('show');paint($('#mstage'),slides[cur])};$('#close').onclick=()=>$('#modal').classList.remove('show');document.addEventListener('keydown',e=>{if(!$('#modal').classList.contains('show'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();$('#next').click()}if(e.key==='ArrowLeft')$('#prev').click();if(e.key==='Escape')$('#close').click()});$('#download').onclick=()=>{if(!slides.length)return;let s=slides[cur],c=document.createElement('canvas');c.width=1600;c.height=900;let x=c.getContext('2d'),g=x.createLinearGradient(0,0,1600,900),pal=({prophecy:['#3b2d23','#d6ad6d'],jesus:['#765d43','#a9bac5'],temple:['#8d653a','#d9c196'],storm:['#111827','#7396aa'],palace:['#51311d','#d0a04e'],battle:['#38322c','#a48360'],cosmos:['#090b17','#4a2d62'],seed:['#8aaa66','#66452b'],scroll:['#4e3823','#d4ad72'],crowd:['#9a6a3d','#667568']})[s.scene];g.addColorStop(0,pal[0]);g.addColorStop(1,pal[1]);x.fillStyle=g;x.fillRect(0,0,1600,900);x.fillStyle='#0008';x.fillRect(0,550,1600,350);x.fillStyle='#f6d9a0';x.font='26px sans-serif';x.fillText(tag(s.scene),110,625);x.fillStyle='#fff';x.font='bold 64px sans-serif';wrapCanvas(x,s.title,110,710,1250,76);x.fillStyle='#eee0c8';x.font='28px sans-serif';wrapCanvas(x,short(s.text),110,810,1300,40);let a=document.createElement('a');a.download=`HeavenBorn_${String(cur+1).padStart(2,'0')}.png`;a.href=c.toDataURL('image/png');a.click()};function wrapCanvas(ctx,t,x,y,w,lh){let line='';for(let ch of t){if(ctx.measureText(line+ch).width>w){ctx.fillText(line,x,y);line=ch;y+=lh}else line+=ch}if(line)ctx.fillText(line,x,y)}load();</script></body></html>
