name: Deploy HeavenBorn Meeting to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "heavenborn-meeting/**"
      - ".github/workflows/heavenborn-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "heavenborn-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload HeavenBorn meeting
        uses: actions/upload-pages-artifact@v4
        with:
          path: "heavenborn-meeting"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
